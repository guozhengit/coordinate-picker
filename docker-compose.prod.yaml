version: '3.8'

services:
  coordinate-picker:
    build:
      context: .
      dockerfile: Dockerfile
    image: coordinate-picker:latest
    container_name: coordinate-picker-prod
    ports:
      - "80:80"
    restart: always
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    labels:
      - "com.coordinate-picker.description=Coordinate Picker Production"
      - "com.coordinate-picker.version=1.0.0"
      - "com.coordinate-picker.environment=production"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
