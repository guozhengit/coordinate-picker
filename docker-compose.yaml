version: '3.8'

services:
  coordinate-picker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-$(date +%Y%m%d_%H%M%S)}
    image: coordinate-picker:${VERSION:-latest}
    container_name: coordinate-picker
    ports:
      - "80:80"
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - VERSION=${VERSION:-latest}
      - BUILD_DATE=${BUILD_DATE:-unknown}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      - "com.coordinate-picker.description=Coordinate Picker Web Application"
      - "com.coordinate-picker.version=${VERSION:-latest}"
      - "com.coordinate-picker.build-date=${BUILD_DATE:-unknown}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"